name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build the native layer
        shell: pwsh
        run: ./build.ps1

      # Both suites run headlessly on purpose: the panel is a pure state
      # machine and Screen.Snapshot() renders to text, so neither needs a TTY.
      - name: Render smoke test
        shell: pwsh
        run: ./tests/Smoke.ps1

      - name: Key dispatch test
        shell: pwsh
        run: ./tests/KeySequence.ps1

      - name: Safety guard test
        shell: pwsh
        run: ./tests/Guard.ps1
