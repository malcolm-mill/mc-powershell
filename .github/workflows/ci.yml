name: CI

# Windows only, by decision -- see docs/PLATFORMS.md.
#
# The Linux and macOS jobs are frozen, not deleted. Restoring them means
# putting this back in place of "runs-on: windows-latest":
#
#   name: ${{ matrix.os }}
#   runs-on: ${{ matrix.os }}
#   strategy:
#     fail-fast: false
#     matrix:
#       os: [windows-latest, ubuntu-latest, macos-latest]
#
# Anything that only works on Windows must be recorded in docs/COMPAT.md, so
# the cost of unfreezing stays visible instead of accumulating silently.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build the native layer
        shell: pwsh
        run: ./build.ps1

      # Every suite runs headlessly: the panel is a pure state machine,
      # Screen.Snapshot() renders to text, and layout is computed data.
      - name: Render smoke test
        shell: pwsh
        run: ./tests/Smoke.ps1

      - name: Lint
        shell: pwsh
        run: ./tests/Lint.ps1

      - name: Key translation test
        shell: pwsh
        run: ./tests/Keys.ps1

      - name: Key dispatch test
        shell: pwsh
        run: ./tests/KeySequence.ps1

      - name: Safety guard test
        shell: pwsh
        run: ./tests/Guard.ps1

      - name: Interface test
        shell: pwsh
        run: ./tests/Interface.ps1

      # A release tag must name the version the manifest carries. See
      # docs/VERSIONING.md. A mistyped tag fails here instead of shipping.
      - name: Tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $manifest = (Import-PowerShellDataFile ./src/Mc.PowerShell/Mc.psd1).ModuleVersion
          if ($tag -ne $manifest) { throw "tag v$tag but Mc.psd1 says $manifest" }
          "tag v$tag matches Mc.psd1"
